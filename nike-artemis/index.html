  var msg = document.getElementById('msg');
  var form = document.getElementById('f');
  var input = document.getElementById('pw');

  function bytes(b64) {
    var s = atob(b64), a = new Uint8Array(s.length);
    for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i);
    return a;
  }
  function say(t, err) { msg.textContent = t; msg.className = 'lock-msg' + (err ? ' err' : ''); }

  async function keyFrom(pw) {
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw),
      'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: bytes(SALT), iterations: ITER, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  }

  async function unlock(pw, remember) {
    say('Unlocking…');
    var key;
    try {
      key = await keyFrom(pw);
      var plain = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: bytes(IV) }, key, bytes(CT));
      var data = JSON.parse(new TextDecoder().decode(plain));
    } catch (e) {
      say('That password didn’t work. Try again.', true);
      input.select();
      return false;
    }

    var ids = Object.keys(data.assets);
    var html = data.html;
    for (var i = 0; i < ids.length; i++) {
      var id = ids[i];
      say('Loading media… ' + (i + 1) + ' of ' + ids.length);
      try {
        var buf = new Uint8Array(await (await fetch('/locked-assets/' + id + '.enc')).arrayBuffer());
        var raw = await crypto.subtle.decrypt(
          { name: 'AES-GCM', iv: buf.slice(0, 12) }, key, buf.slice(12));
        var url = URL.createObjectURL(new Blob([raw], { type: data.assets[id].t }));
        html = html.split('__ENC__' + id + '__').join(url);
      } catch (e) { /* leave the token; a single bad asset shouldn't block the page */ }
    }

    if (remember) {
      try { sessionStorage.setItem('dj-unlock-' + location.pathname, pw); } catch (e) {}
    }
    document.open(); document.write(html); document.close();
    return true;
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (input.value) unlock(input.value, true);
  });

  // don't re-prompt when coming back during the same browser session
  try {
    var saved = sessionStorage.getItem('dj-unlock-' + location.pathname);
    if (saved) unlock(saved, false);
